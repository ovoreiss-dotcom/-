<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Starhoney：Poppy的生日惊喜</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#b8d9d0;font-family:system-ui,-apple-system,sans-serif}#game{position:relative;width:min(100vw,520px);height:100vh;margin:auto;background:#a8cfac;overflow:hidden}.start{position:absolute;inset:0;z-index:30;display:grid;place-items:center;text-align:center;background:linear-gradient(#a9dcd5,#fae4d6)}.card{background:#fffaf0ee;border:4px solid #fff;border-radius:22px;padding:28px 24px;box-shadow:0 8px 0 #8ba69a;color:#66556a}.logo{font:38px Georgia;color:#7b607b;text-shadow:2px 2px #efadc5}.btn{background:#e897b6;color:#fff;border:3px solid #fff;border-radius:14px;padding:13px 45px;font-size:18px;font-weight:800}.hud{position:absolute;z-index:20;top:9px;left:9px;right:9px;background:#fffaf0e8;border:3px solid #fff;border-radius:14px;padding:8px 11px;color:#66556a}.row{display:flex;justify-content:space-between;font-weight:800}.obj{font-size:12px;margin-top:3px}.world{position:absolute;inset:76px 7px 7px;border:5px solid #fff;border-radius:20px;overflow:hidden;background:#b8d99d}.grass{position:absolute;inset:0;background-color:#b8d99d;background-image:radial-gradient(#8fb984 1.5px,transparent 1.5px),radial-gradient(#d7e7b5 1.2px,transparent 1.2px);background-size:24px 24px,31px 31px;background-position:0 0,11px 9px}.path{position:absolute;background:#ead4aa;border:3px solid #d2b98f}.hpath{left:-5px;right:-5px;top:57%;height:68px}.vpath{top:-5px;bottom:-5px;left:48%;width:66px}.house{position:absolute;right:7%;top:8%;width:178px;height:118px;background:#f5d3b7;border:5px solid #825e69}.roof{position:absolute;left:-8px;top:-31px;width:186px;height:44px;background:#d17d91;border:5px solid #825e69;transform:skewX(-12deg)}.door{position:absolute;bottom:0;left:72px;width:37px;height:63px;background:#9b7180;border:4px solid #825e69}.win{position:absolute;bottom:47px;left:18px;width:43px;height:34px;background:#a9e0df;border:4px solid #825e69}.tree{position:absolute;width:55px;height:72px}.tree:before{content:'';position:absolute;left:5px;top:0;width:45px;height:47px;background:#6e9e69;border:4px solid #56775e;border-radius:50%}.tree:after{content:'';position:absolute;left:25px;top:40px;width:12px;height:32px;background:#9a745d;border:3px solid #765956}.t1{left:6%;top:9%}.t2{left:6%;top:37%}.t3{right:5%;top:68%}.t4{left:20%;bottom:5%}.npc,.player{position:absolute;width:52px;height:70px;z-index:10;transform:translate(-50%,-50%)}.head{position:absolute;left:8px;top:3px;width:36px;height:34px;background:#fff0df;border:3px solid #604e65;border-radius:12px}.hair{position:absolute;left:3px;top:1px;width:42px;height:25px;background:var(--hair);border:3px solid #604e65;border-radius:13px 13px 8px 8px}.eye{position:absolute;top:20px;width:4px;height:5px;background:#4c5870}.a{left:15px}.b{left:28px}.body{position:absolute;left:8px;top:31px;width:36px;height:31px;background:#bce5e1;border:3px solid #604e65;border-radius:10px}.ribbon{position:absolute;right:-7px;top:2px;color:var(--ribbon);font-size:18px}.label{position:absolute;top:62px;left:-20px;width:94px;text-align:center;font-size:10px;font-weight:800;color:#5c5063;text-shadow:0 1px #fff}.player .body{background:#f0a4c0}.item{position:absolute;z-index:5;width:28px;height:24px;background:#e996b3;border:4px solid #fff;border-radius:5px;color:#fff;text-align:center;font-weight:900;padding-top:0}.starbox{left:17%;bottom:20%}.stage{position:absolute;left:36%;top:12%;width:145px;height:62px;background:#d990ae;border:5px solid #fff;border-radius:8px;text-align:center;padding-top:14px;color:#fff;font-weight:900}.bubble{position:absolute;z-index:22;left:12px;right:12px;bottom:128px;background:#fffaf2;border:3px solid #fff;border-radius:15px;padding:12px;color:#5d4f63;display:none}.bubble.show{display:block}.controls{position:absolute;z-index:25;left:17px;bottom:17px;width:150px;height:150px}.ctrl{position:absolute;width:50px;height:50px;border:3px solid #fff;border-radius:14px;background:#fffaf0d9;color:#6c5970;font-size:18px}.up{left:50px}.down{left:50px;bottom:0}.left{left:0;top:50px}.right{right:0;top:50px}.action{position:absolute;z-index:25;right:18px;bottom:25px;width:82px;height:82px;border-radius:50%;border:4px solid #fff;background:#e897b6;color:#fff;font-weight:900}.toast{position:absolute;z-index:40;left:25px;right:25px;top:44%;background:#fffaf2;border:3px solid #fff;border-radius:15px;padding:14px;text-align:center;color:#66536b;display:none}.toast.show{display:block}</style></head><body><div id="game"><div class="start" id="start"><div class="card"><div style="font-size:50px;color:#e897b6">★</div><div class="logo">STARHONEY</div><p>《Poppy的生日惊喜》</p><p>大家正在偷偷准备一场生日惊喜。</p><button class="btn" onclick="begin()">开始游戏</button></div></div><div class="hud"><div class="row"><span>Day 1 · 下午</span><span id="heart">♡ 0</span></div><div class="obj" id="obj">找到小唯，听听她的秘密。</div></div><div class="world" id="world"><div class="grass"></div><div class="path hpath"></div><div class="path vpath"></div><div class="house"><div class="roof"></div><div class="win"></div><div class="door"></div></div><div class="stage">BIRTHDAY STAGE</div><div class="tree t1"></div><div class="tree t2"></div><div class="tree t3"></div><div class="tree t4"></div><div class="item starbox">★</div><div class="npc" id="yui" style="left:35%;top:56%;--hair:#e8a5bc;--ribbon:#80d7d7"><div class="head"><div class="hair"></div><i class="eye a"></i><i class="eye b"></i></div><div class="body"></div><div class="ribbon">♥</div><div class="label">小唯 Yui</div></div><div class="npc" id="poppy" style="left:75%;top:44%;--hair:#efd9b2;--ribbon:#e994b4"><div class="head"><div class="hair"></div><i class="eye a"></i><i class="eye b"></i></div><div class="body"></div><div class="ribbon">♥</div><div class="label">兔兔 Poppy</div></div><div class="player" id="player" style="left:50%;top:78%;--hair:#f5e8d2;--ribbon:#e994b4"><div class="head"><div class="hair"></div><i class="eye a"></i><i class="eye b"></i></div><div class="body"></div><div class="ribbon">♥</div><div class="label">玩家兔兔</div></div></div><div class="bubble" id="bubble"></div><div class="controls"><button class="ctrl up" data-k="up">▲</button><button class="ctrl down" data-k="down">▼</button><button class="ctrl left" data-k="left">◀</button><button class="ctrl right" data-k="right">▶</button></div><button class="action" onclick="interact()">互动</button><div class="toast" id="toast"></div></div><script>let x=50,y=78,keys={},stage=0,started=false;const p=document.getElementById('player'),yui=document.getElementById('yui'),poppy=document.getElementById('poppy');function begin(){started=true;document.getElementById('start').style.display='none';say('今天的任务：找到小唯。她似乎藏着一个秘密。')}function say(t){let b=document.getElementById('bubble');b.innerHTML=t;b.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>b.classList.remove('show'),4500)}function d(el){let a=el.getBoundingClientRect(),w=document.getElementById('world').getBoundingClientRect();let ex=(a.left+a.width/2-w.left)/w.width*100,ey=(a.top+a.height/2-w.top)/w.height*100;return Math.hypot((x-ex)*5,(y-ey)*5)}function interact(){if(!started)return;if(stage===0&&d(yui)<95){stage=1;document.getElementById('heart').textContent='♥ 1';document.getElementById('obj').textContent='找到星星装饰，再交给小唯。';say('<b>小唯：</b>嘘……我们正在偷偷准备 Poppy 的生日惊喜！她来自月亮城堡，应该会喜欢星星和月亮。你愿意帮忙吗？');return}if(stage===1&&x<35&&y>55){stage=2;document.getElementById('obj').textContent='把星星装饰交给小唯。';say('你发现了一盒星星装饰。带回去给小唯吧。');return}if(stage===2&&d(yui)<95){stage=3;document.getElementById('obj').textContent='去找 Poppy，但不要说漏嘴。';say('<b>小唯：</b>太好了！接下来就交给大家。记住——这是秘密。');return}if(stage===3&&d(poppy)<95){stage=4;document.getElementById('heart').textContent='♥ 2';document.getElementById('obj').textContent='第一章完成 · 等待生日当天';say('<b>兔兔 Poppy：</b>今天大家怎么都神神秘秘的？谢谢你陪着我呀。');let t=document.getElementById('toast');t.textContent='第一章完成 · 惊喜准备中';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);return}say('走近角色或星星装饰，再点击「互动」。')}function loop(){if(started){let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0);if(dx||dy){let n=Math.hypot(dx,dy);x+=dx/n*.72;y+=dy/n*.72;x=Math.max(7,Math.min(93,x));y=Math.max(10,Math.min(92,y));p.style.left=x+'%';p.style.top=y+'%'}}requestAnimationFrame(loop)}document.querySelectorAll('.ctrl').forEach(e=>{let k=e.dataset.k;e.addEventListener('pointerdown',q=>{q.preventDefault();keys[k]=1});['pointerup','pointercancel','pointerleave'].forEach(v=>e.addEventListener(v,()=>keys[k]=0))});addEventListener('keydown',e=>{let k={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'}[e.key];if(k)keys[k]=1;if(e.key==='Enter'||e.key===' ')interact()});addEventListener('keyup',e=>{let k={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'}[e.key];if(k)keys[k]=0});loop();</script></body></html>
