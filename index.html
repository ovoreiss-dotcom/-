<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Starhoney：Poppy的生日惊喜</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#b9d8d0;font-family:system-ui,sans-serif;color:#5c4b61}button{font:inherit;touch-action:manipulation}#app{position:relative;width:min(100vw,520px);height:100dvh;margin:auto;background:#cce5b0;overflow:hidden}.screen{position:absolute;inset:0;z-index:9;display:grid;place-items:center;text-align:center;padding:24px;background:linear-gradient(#a9dfe0,#ffe3ed)}.card{background:#fff8e8;border:4px solid #765c73;border-radius:18px;padding:26px 20px;box-shadow:0 7px 0 #765c73}.logo{font:38px Georgia;color:#765c73;text-shadow:2px 2px #efabc4}.startbtn{border:3px solid #765c73;border-radius:12px;background:#ed91b2;color:white;padding:13px 42px;font-weight:800}.hud{position:absolute;z-index:5;top:10px;left:10px;right:10px;padding:10px 13px;background:#fff8e8;border:3px solid #765c73;border-radius:12px;box-shadow:0 3px 0 #765c73}.hud b{font-size:15px}.hud small{display:block;margin-top:4px}.map{position:absolute;inset:86px 8px 8px;border:5px solid #765c73;border-radius:15px;overflow:hidden;background:#a9d39b}.grass{position:absolute;inset:0;background-color:#a9d39b;background-image:radial-gradient(#82b781 1.5px,transparent 1.5px);background-size:22px 22px}.path{position:absolute;background:#e8cf9f;border:3px solid #c8ac7f}.path.h{left:-5px;right:-5px;top:58%;height:65px}.path.v{top:-5px;bottom:-5px;left:48%;width:60px}.house{position:absolute;right:7%;top:8%;width:160px;height:105px;background:#f4d0ad;border:5px solid #765c73}.house:before{content:'';position:absolute;left:-10px;top:-34px;border-left:85px solid transparent;border-right:85px solid transparent;border-bottom:42px solid #d77f98}.door{position:absolute;bottom:0;left:61px;width:35px;height:58px;background:#9c7180;border:4px solid #765c73}.window{position:absolute;left:17px;bottom:42px;width:42px;height:31px;background:#a9e1e4;border:4px solid #765c73}.tree{position:absolute;width:46px;height:65px}.tree:before{content:'';position:absolute;left:0;top:0;width:43px;height:43px;background:#6b9f70;border:4px solid #50765d;border-radius:50%}.tree:after{content:'';position:absolute;left:17px;top:39px;width:11px;height:27px;background:#96705a;border:3px solid #765c73}.t1{left:5%;top:8%}.t2{left:6%;top:38%}.t3{right:5%;bottom:7%}.stage{position:absolute;left:34%;top:10%;width:150px;height:55px;background:#d98eae;border:5px solid #765c73;border-radius:7px;color:white;text-align:center;padding-top:13px;font-weight:900}.item{position:absolute;width:34px;height:30px;background:#ed91b2;border:4px solid #765c73;border-radius:5px;color:#fff4a8;text-align:center;font-size:22px;line-height:22px}.starbox{left:15%;bottom:19%}.actor{position:absolute;width:58px;height:78px;transform:translate(-50%,-50%);z-index:3}.hair{position:absolute;left:8px;top:2px;width:42px;height:34px;background:var(--hair);border:4px solid #765c73;border-radius:15px 15px 10px 10px}.face{position:absolute;left:15px;top:18px;width:30px;height:23px;background:#fff0dc;border:3px solid #765c73;border-radius:8px}.eye{position:absolute;top:27px;width:4px;height:6px;background:#53617a}.e1{left:21px}.e2{left:33px}.dress{position:absolute;left:10px;top:40px;width:38px;height:32px;background:#bde5e2;border:4px solid #765c73;border-radius:10px 10px 14px 14px}.skirt{position:absolute;left:5px;top:61px;width:48px;height:13px;background:#efa5c3;border:3px solid #765c73}.bow{position:absolute;right:-7px;top:0;color:var(--bow);font-size:22px;text-shadow:1px 1px #765c73}.name{position:absolute;top:76px;left:-25px;width:108px;text-align:center;font-size:11px;font-weight:900;text-shadow:0 2px white}.player .dress{background:#f2abc7}.bubble{display:none;position:absolute;z-index:7;left:14px;right:14px;bottom:125px;padding:13px;background:#fff8e8;border:4px solid #765c73;border-radius:13px;line-height:1.55;box-shadow:0 4px 0 #765c73}.bubble.show{display:block}.controls{position:absolute;z-index:8;left:16px;bottom:15px;width:148px;height:148px}.ctrl{position:absolute;width:50px;height:50px;border:3px solid #765c73;border-radius:12px;background:#fff8e8;color:#765c73;font-size:20px;font-weight:900}.up{left:49px}.down{left:49px;bottom:0}.left{left:0;top:49px}.right{right:0;top:49px}.act{position:absolute;z-index:8;right:18px;bottom:30px;width:86px;height:86px;border:4px solid #765c73;border-radius:50%;background:#ed91b2;color:white;font-weight:900}.toast{display:none;position:absolute;z-index:10;top:43%;left:25px;right:25px;padding:15px;background:#fff8e8;border:4px solid #765c73;border-radius:14px;text-align:center}.toast.show{display:block}</style><body><main id="app"><section class="screen" id="start"><div class="card"><div style="font-size:48px">★</div><div class="logo">STARHONEY</div><p>《Poppy的生日惊喜》</p><p>成为秘密帮手，和小唯一起准备兔兔的生日。</p><button class="startbtn" id="begin">开始游戏</button></div></section><header class="hud"><b>Starhoney · 休息室</b><small id="objective">找到小唯，听听她的秘密。</small></header><section class="map" id="map"><div class="grass"></div><div class="path h"></div><div class="path v"></div><div class="house"><div class="window"></div><div class="door"></div></div><div class="stage">BIRTHDAY STAGE</div><div class="tree t1"></div><div class="tree t2"></div><div class="tree t3"></div><div class="item starbox" id="star">★</div><div class="actor" id="yui" style="left:35%;top:57%;--hair:#e9a8bd;--bow:#8dd9d8"><div class="hair"></div><div class="face"></div><i class="eye e1"></i><i class="eye e2"></i><div class="dress"></div><div class="skirt"></div><div class="bow">♥</div><div class="name">小唯 Yui</div></div><div class="actor" id="poppy" style="left:76%;top:45%;--hair:#f0d8ad;--bow:#ed91b2"><div class="hair"></div><div class="face"></div><i class="eye e1"></i><i class="eye e2"></i><div class="dress"></div><div class="skirt"></div><div class="bow">♥</div><div class="name">兔兔 Poppy</div></div><div class="actor player" id="player" style="left:50%;top:78%;--hair:#f8ead5;--bow:#ed91b2"><div class="hair"></div><div class="face"></div><i class="eye e1"></i><i class="eye e2"></i><div class="dress"></div><div class="skirt"></div><div class="bow">♥</div><div class="name">玩家兔兔</div></div></section><div class="bubble" id="bubble"></div><div class="controls"><button class="ctrl up" data-k="up">▲</button><button class="ctrl down" data-k="down">▼</button><button class="ctrl left" data-k="left">◀</button><button class="ctrl right" data-k="right">▶</button></div><button class="act" id="act">互动</button><div class="toast" id="toast"></div></main><script>const $=id=>document.getElementById(id);let x=50,y=78,held={},started=false,stage=0;function say(t){$('bubble').innerHTML=t;$('bubble').classList.add('show');clearTimeout(window.timer);window.timer=setTimeout(()=>$('bubble').classList.remove('show'),5200)}function begin(){started=true;$('start').style.display='none';say('<b>小唯：</b>你来啦！嘘……我们正在为兔兔准备生日惊喜。先去找我聊聊吧。')}function position(el){let r=el.getBoundingClientRect(),m=$('map').getBoundingClientRect();return[(r.left+r.width/2-m.left)/m.width*100,(r.top+r.height/2-m.top)/m.height*100]}function near(id){let q=position($(id));return Math.hypot((x-q[0])*1.1,(y-q[1])*1.1)<14}function interact(){if(!started)return;if(stage===0&&near('yui')){stage=1;$('objective').textContent='找到地图左下角的星星装饰。';say('<b>小唯：</b>兔兔来自月亮城堡，最喜欢星星和温柔的惊喜。可以帮我找一盒星星装饰吗？');return}if(stage===1&&near('star')){stage=2;$('objective').textContent='把星星装饰交给小唯。';say('你找到了闪闪发光的星星装饰！带回去交给小唯吧。');return}if(stage===2&&near('yui')){stage=3;$('objective').textContent='去找兔兔 Poppy，千万不要说漏嘴。';say('<b>小唯：</b>谢谢你！记住，这是我们之间的小秘密。');return}if(stage===3&&near('poppy')){stage=4;$('objective').textContent='第一章完成 · 生日惊喜准备中';say('<b>兔兔 Poppy：</b>今天大家怎么都神神秘秘的？谢谢你陪我玩！');$('toast').textContent='第一章完成！星星已经藏好啦。';$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200);return}say('走近小唯、星星装饰或兔兔 Poppy，再点击「互动」。')}function loop(){if(started){let dx=(held.right?1:0)-(held.left?1:0),dy=(held.down?1:0)-(held.up?1:0);if(dx||dy){let n=Math.hypot(dx,dy);x=Math.max(7,Math.min(93,x+dx/n*.7));y=Math.max(10,Math.min(93,y+dy/n*.7));$('player').style.left=x+'%';$('player').style.top=y+'%'}}requestAnimationFrame(loop)}document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();held[k]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>held[k]=false))});addEventListener('keydown',e=>{let k={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',a:'left',s:'down',d:'right'}[e.key];if(k){held[k]=true;e.preventDefault()}if(e.key===' '||e.key==='Enter')interact()});addEventListener('keyup',e=>{let k={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',a:'left',s:'down',d:'right'}[e.key];if(k)held[k]=false});$('begin').onclick=begin;$('act').onclick=interact;loop();</script></body></html>
