<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Starhoney：Poppy的生日惊喜</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#c9eff0;font-family:-apple-system,BlinkMacSystemFont,sans-serif}body{display:grid;place-items:center}.game{width:min(100vw,480px);height:100vh;background:#dff3df;position:relative;overflow:hidden}.title{position:absolute;top:24px;left:14px;right:14px;background:#fffdf4ee;border:3px solid white;border-radius:16px;padding:10px;color:#694f69;z-index:5}.map{position:absolute;inset:105px 10px 12px;border:5px solid white;border-radius:24px;background:repeating-linear-gradient(0deg,#dff3df 0 30px,#c2dfd6 31px 32px),repeating-linear-gradient(90deg,transparent 0 30px,#c2dfd6 31px 32px)}.room{position:absolute;inset:0}.window{position:absolute;left:50%;top:20px;transform:translateX(-50%);width:150px;height:60px;background:#fff8df;border:6px solid #e7b7cd;border-radius:8px}.sofa{position:absolute;left:22px;top:125px;width:100px;height:50px;background:#e6b0c6;border:5px solid white;border-radius:12px}.table{position:absolute;right:22px;top:140px;width:95px;height:50px;background:#efd09b;border:5px solid white;border-radius:12px}.gift{position:absolute;left:55px;bottom:125px;background:#ef8faf;color:#ffe9a8;border:4px solid white;border-radius:5px;padding:6px 12px;font-size:25px}.char{position:absolute;width:64px;height:85px;transform:translate(-50%,-50%);z-index:3}.person{position:absolute;left:9px;top:13px;width:45px;height:55px}.hair{position:absolute;left:5px;top:5px;width:35px;height:34px;background:var(--hair);border:3px solid #765d70;border-radius:12px}.face{position:absolute;left:10px;top:16px;width:25px;height:23px;background:#fff1e7;border:3px solid #765d70;border-radius:7px}.eye{position:absolute;top:27px;width:4px;height:5px;background:#53617c}.e1{left:16px}.e2{left:27px}.dress{position:absolute;left:8px;top:43px;width:31px;height:25px;background:#bfe7e6;border:3px solid #765d70;border-radius:7px}.skirt{position:absolute;left:4px;top:60px;width:39px;height:12px;background:#f3a8c4;border:3px solid #765d70}.bow{position:absolute;right:-2px;top:7px;color:var(--bow);font-size:18px;text-shadow:1px 1px #765d70}.name{position:absolute;top:69px;left:-10px;width:84px;text-align:center;font-size:11px;font-weight:900;color:#5e4e66;text-shadow:0 1px white}.controls{position:absolute;bottom:20px;left:18px;z-index:8;width:145px;height:145px}.b{position:absolute;width:50px;height:50px;border:3px solid white;border-radius:14px;background:#fffdf0dd;color:#765a73;font-size:20px}.u{left:47px}.d{left:47px;bottom:0}.l{top:47px}.r{top:47px;right:0}.act{position:absolute;right:18px;bottom:24px;width:84px;height:84px;border-radius:50%;border:4px solid white;background:#ed8fb4;color:#fff;font-weight:900;z-index:8}.msg{position:absolute;display:none;left:12px;right:12px;bottom:120px;background:#fffdf7;border:3px solid white;border-radius:16px;padding:12px;z-index:9;color:#594a60}.msg.show{display:block}.start{position:absolute;inset:0;background:linear-gradient(#bceff1,#fff0f6);z-index:20;display:grid;place-items:center;text-align:center;padding:25px}.start h1{color:white;text-shadow:3px 3px #8e6a91;font-size:35px}.start button{border:0;border-radius:16px;padding:15px 50px;background:#ed8fb4;color:white;font-weight:900;font-size:20px}</style></head><body><div class="game"><div class="start" id="start"><div><div style="font-size:55px">🐰🎀</div><h1>Starhoney</h1><p>《Poppy的生日惊喜》</p><button onclick="begin()">开始游戏</button></div></div><div class="title"><b>Starhoney 休息室</b><br><small id="obj">先去找小唯，她好像有话要说。</small></div><div class="map"><div class="window"></div><div class="sofa"></div><div class="table"></div><div class="gift" id="gift">★</div><div class="char" id="yui" style="left:50%;top:37%;--hair:#eaa7bd;--bow:#8dd8dc"><div class="person"><div class="hair"></div><div class="face"></div><i class="eye e1"></i><i class="eye e2"></i><div class="dress"></div><div class="skirt"></div><div class="bow">♥</div></div><div class="name">小唯 Yui</div></div><div class="char" id="poppy" style="left:77%;top:49%;--hair:#f0d8ad;--bow:#ed8fb4"><div class="person"><div class="hair"></div><div class="face"></div><i class="eye e1"></i><i class="eye e2"></i><div class="dress"></div><div class="skirt"></div><div class="bow">♥</div></div><div class="name">兔兔 Poppy</div></div><div class="char" id="player" style="left:50%;top:65%;--hair:#fff1df;--bow:#ed8fb4"><div class="person"><div class="hair"></div><div class="face"></div><i class="eye e1"></i><i class="eye e2"></i><div class="dress"></div><div class="skirt"></div><div class="bow">♥</div></div><div class="name">玩家兔兔</div></div></div><div class="controls"><button class="b u" data-k="u">▲</button><button class="b d" data-k="d">▼</button><button class="b l" data-k="l">◀</button><button class="b r" data-k="r">▶</button></div><button class="act" onclick="interact()">互动</button><div class="msg" id="msg"></div></div><script>let x=50,y=65,keys={};function begin(){document.getElementById('start').style.display='none'}function move(){let dx=(keys.r?1:0)-(keys.l?1:0),dy=(keys.d?1:0)-(keys.u?1:0);if(dx||dy){let l=Math.hypot(dx,dy);x+=dx/l*.45;y+=dy/l*.45;x=Math.max(15,Math.min(85,x));y=Math.max(27,Math.min(90,y));let p=document.getElementById('player');p.style.left=x+'%';p.style.top=y+'%'}requestAnimationFrame(move)}document.querySelectorAll('.b').forEach(b=>{let k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();keys[k]=1};b.onpointerup=()=>keys[k]=0;b.onpointercancel=()=>keys[k]=0;b.onpointerleave=()=>keys[k]=0});function dist(id){let a=document.getElementById('player').getBoundingClientRect(),b=document.getElementById(id).getBoundingClientRect();return Math.hypot(a.left-b.left,a.top-b.top)}function interact(){let m=document.getElementById('msg'),o=document.getElementById('obj');if(dist('yui')<100){m.innerHTML='<b style="color:#d36c98">小唯 Yui</b><br>嘘……我和大家正在偷偷准备 Poppy 的生日惊喜！你愿意帮忙吗？';m.classList.add('show');o.textContent='去看看桌边的神秘礼物盒。'}else if(dist('gift')<100){m.innerHTML='<b style="color:#d36c98">神秘礼物盒</b><br>纸条上写着：月亮城堡的星星，会在生日舞台上闪耀。';m.classList.add('show');o.textContent='不要被 Poppy 发现，去找她吧。'}else if(dist('poppy')<100){m.innerHTML='<b style="color:#d36c98">兔兔 Poppy</b><br>咦？今天大家怎么都神神秘秘的？谢谢你陪着大家！';m.classList.add('show');o.textContent='生日惊喜准备中……'}else{m.innerHTML='走近小唯、礼物盒或 Poppy，再点击「互动」。';m.classList.add('show')}setTimeout(()=>m.classList.remove('show'),5000)}move();</script></div></body></html>
